<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 高校心理健康测评系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; min-height: 100vh; display: flex; background: #0a0a1a; overflow: hidden; }
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .cursor-glow { position: fixed; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(102,126,234,0.15) 0%, transparent 70%); pointer-events: none; z-index: 1; transform: translate(-50%, -50%); }
        .left-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 60px; position: relative; z-index: 2; }
        .left-panel .brand-icon { width: 100px; height: 100px; border-radius: 24px; background: linear-gradient(135deg, rgba(102,126,234,0.3), rgba(118,75,162,0.3)); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 48px; margin-bottom: 30px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .left-panel h1 { font-size: 36px; margin-bottom: 16px; background: linear-gradient(135deg, #fff, #c5cae9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .left-panel .subtitle { font-size: 16px; opacity: 0.7; line-height: 1.8; text-align: center; max-width: 400px; }
        .float-decor { position: absolute; border-radius: 50%; opacity: 0.1; animation: floatAround 20s linear infinite; }
        .decor-1 { width: 200px; height: 200px; background: #667eea; top: 10%; left: 5%; }
        .decor-2 { width: 150px; height: 150px; background: #764ba2; bottom: 15%; left: 15%; animation-delay: -5s; }
        .decor-3 { width: 100px; height: 100px; background: #f093fb; top: 20%; right: 55%; animation-delay: -10s; }
        @keyframes floatAround { 0% { transform: translate(0,0) rotate(0deg); } 25% { transform: translate(30px,-30px) rotate(90deg); } 50% { transform: translate(-20px,20px) rotate(180deg); } 75% { transform: translate(20px,30px) rotate(270deg); } 100% { transform: translate(0,0) rotate(360deg); } }
        .right-panel { width: 560px; display: flex; align-items: center; justify-content: center; padding: 40px; position: relative; z-index: 2; overflow-y: auto; }
        .glass-card { width: 100%; max-width: 440px; background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); border-radius: 24px; padding: 35px 32px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .glass-card h2 { font-size: 26px; color: white; margin-bottom: 20px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 12px; color: rgba(255,255,255,0.6); font-weight: 500; letter-spacing: 0.5px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; font-size: 14px; color: white; transition: all 0.3s; }
        .form-group input::placeholder { color: rgba(255,255,255,0.3); }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: rgba(102,126,234,0.6); background: rgba(255,255,255,0.1); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .form-group select option { background: #1a1a2e; color: white; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; font-weight: 600; transition: all 0.3s; position: relative; overflow: hidden; margin-top: 6px; }
        .btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.5s; }
        .btn:hover::before { left: 100%; }
        .btn:hover { box-shadow: 0 6px 25px rgba(102,126,234,0.5); transform: translateY(-2px); }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .links a:hover { color: #667eea; }
        .error { color: #ff6b6b; text-align: center; margin-bottom: 15px; padding: 10px; background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.2); border-radius: 10px; font-size: 14px; }
        @media (max-width: 900px) { .left-panel { display: none; } .right-panel { width: 100%; } }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="float-decor decor-1"></div>
    <div class="float-decor decor-2"></div>
    <div class="float-decor decor-3"></div>

    <div class="left-panel">
        <div class="brand-icon">&#128221;</div>
        <h1>学生注册</h1>
        <p class="subtitle">注册账号后即可使用心理测评功能，<br>系统将为您提供专业的心理健康评估。</p>
    </div>
    <div class="right-panel">
        <div class="glass-card" id="regCard">
            <h2>学生注册</h2>
            <div th:if="${error}" class="error" th:text="${error}"></div>
            <form th:action="@{/user/register}" method="post">
                <div class="form-row">
                    <div class="form-group"><label>学号</label><input type="text" name="username" required placeholder="请输入学号"></div>
                    <div class="form-group"><label>姓名</label><input type="text" name="realName" required placeholder="请输入姓名"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>密码</label><input type="password" name="password" required placeholder="请设置密码"></div>
                    <div class="form-group"><label>性别</label><select name="gender"><option value="男">男</option><option value="女">女</option></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>学院</label><input type="text" name="college" placeholder="如：计算机学院"></div>
                    <div class="form-group"><label>专业</label><input type="text" name="major" placeholder="如：软件工程"></div>
                </div>
                <div class="form-group"><label>手机号</label><input type="text" name="phone" placeholder="请输入手机号"></div>
                <button type="submit" class="btn">注 册</button>
            </form>
            <div class="links">已有账号？<a th:href="@{/user/login}">立即登录</a></div>
        </div>
    </div>
    <script>
    (function() {
        var canvas = document.getElementById('particles');
        var ctx = canvas.getContext('2d');
        var particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);
        function Particle() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.vx = (Math.random()-0.5)*0.5; this.vy = (Math.random()-0.5)*0.5; this.r = Math.random()*2+1; this.o = Math.random()*0.5+0.1; }
        for (var i=0;i<60;i++) particles.push(new Particle());
        function draw() { ctx.clearRect(0,0,canvas.width,canvas.height); for(var i=0;i<particles.length;i++){var p=particles[i]; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(102,126,234,'+p.o+')'; ctx.fill(); for(var j=i+1;j<particles.length;j++){var p2=particles[j]; var dx=p.x-p2.x;var dy=p.y-p2.y;var d=Math.sqrt(dx*dx+dy*dy);if(d<150){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);ctx.strokeStyle='rgba(102,126,234,'+(0.08*(1-d/150))+')';ctx.lineWidth=0.5;ctx.stroke();}} p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>canvas.width)p.vx*=-1;if(p.y<0||p.y>canvas.height)p.vy*=-1;} requestAnimationFrame(draw); }
        draw();
        var glow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', function(e) { glow.style.left=e.clientX+'px'; glow.style.top=e.clientY+'px'; });
        var card = document.getElementById('regCard');
        card.style.opacity='0'; card.style.transform='translateY(30px)'; card.style.transition='all 0.8s cubic-bezier(0.16,1,0.3,1)';
        setTimeout(function(){card.style.opacity='1';card.style.transform='translateY(0)';},200);
    })();
    </script>
</body>
</html>
