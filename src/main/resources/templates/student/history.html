<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测评记录 - 心理健康测评系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #0e0e1a; min-height: 100vh; overflow-x: hidden; color: #e0e0e0; }
        .bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .navbar { background: rgba(20,20,35,0.85); backdrop-filter: blur(20px); padding: 0 30px; height: 64px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .navbar .brand { font-size: 17px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 10px; }
        .navbar .brand .icon { width: 34px; height: 34px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .nav-links { display: flex; gap: 6px; }
        .nav-links a { color: rgba(255,255,255,0.55); text-decoration: none; font-size: 14px; padding: 8px 16px; border-radius: 8px; transition: all 0.3s; }
        .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .nav-links a.active { color: #fff; background: linear-gradient(135deg, rgba(102,126,234,0.3), rgba(118,75,162,0.3)); }

        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }
        .page-header { margin-bottom: 40px; text-align: center; }
        .page-header .deco-line { width: 60px; height: 3px; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 2px; margin: 0 auto 20px; }
        .page-header h2 { font-size: 32px; color: #fff; font-weight: 300; letter-spacing: 4px; }
        .page-header p { color: rgba(255,255,255,0.4); margin-top: 10px; font-size: 14px; }

        .record-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 28px 32px; margin-bottom: 18px; display: flex; align-items: center; gap: 24px; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; }
        .record-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 2px; }
        .record-card.level-normal::before { background: linear-gradient(180deg, #43e97b, #38f9d7); }
        .record-card.level-light::before { background: linear-gradient(180deg, #f6d365, #fda085); }
        .record-card.level-moderate::before { background: linear-gradient(180deg, #f093fb, #f5576c); }
        .record-card.level-severe::before { background: linear-gradient(180deg, #f5576c, #ff6b6b); }
        .record-card:hover { border-color: rgba(102,126,234,0.3); transform: translateX(6px); box-shadow: 0 10px 40px rgba(0,0,0,0.2); }

        .score-circle { width: 64px; height: 64px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
        .score-circle.normal { background: rgba(67,233,123,0.1); border: 2px solid rgba(67,233,123,0.3); }
        .score-circle.light { background: rgba(246,211,101,0.1); border: 2px solid rgba(246,211,101,0.3); }
        .score-circle.moderate { background: rgba(240,147,251,0.1); border: 2px solid rgba(240,147,251,0.3); }
        .score-circle.severe { background: rgba(245,87,108,0.1); border: 2px solid rgba(245,87,108,0.3); }
        .score-circle .num { font-size: 22px; font-weight: bold; color: #fff; line-height: 1; }
        .score-circle .unit { font-size: 10px; color: rgba(255,255,255,0.4); }

        .record-info { flex: 1; }
        .record-info h4 { font-size: 17px; color: #fff; font-weight: 500; margin-bottom: 8px; }
        .record-meta { display: flex; gap: 16px; font-size: 13px; color: rgba(255,255,255,0.35); }
        .level-tag { padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
        .tag-normal { background: rgba(67,233,123,0.12); color: #43e97b; border: 1px solid rgba(67,233,123,0.2); }
        .tag-light { background: rgba(246,211,101,0.12); color: #f6d365; border: 1px solid rgba(246,211,101,0.2); }
        .tag-moderate { background: rgba(240,147,251,0.12); color: #f093fb; border: 1px solid rgba(240,147,251,0.2); }
        .tag-severe { background: rgba(245,87,108,0.12); color: #f5576c; border: 1px solid rgba(245,87,108,0.2); }
        .warning-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f5576c; margin-left: 8px; animation: pulse 2s ease infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }
        .btn-detail { padding: 8px 20px; background: rgba(102,126,234,0.15); color: #667eea; border: 1px solid rgba(102,126,234,0.2); border-radius: 10px; text-decoration: none; font-size: 13px; transition: all 0.3s; white-space: nowrap; }
        .btn-detail:hover { background: rgba(102,126,234,0.25); border-color: rgba(102,126,234,0.4); color: #fff; }
        .btn-delete { padding: 8px 20px; background: rgba(245,87,108,0.1); color: #f5576c; border: 1px solid rgba(245,87,108,0.2); border-radius: 10px; text-decoration: none; font-size: 13px; transition: all 0.3s; white-space: nowrap; cursor: pointer; }
        .btn-delete:hover { background: rgba(245,87,108,0.2); border-color: rgba(245,87,108,0.4); color: #fff; }
        .record-actions { display: flex; gap: 10px; flex-shrink: 0; }
        .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
        .confirm-overlay.show { opacity: 1; visibility: visible; }
        .confirm-box { background: rgba(30,30,50,0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; text-align: center; max-width: 400px; width: 90%; transform: translateY(20px); transition: transform 0.3s; }
        .confirm-overlay.show .confirm-box { transform: translateY(0); }
        .confirm-box h4 { color: #fff; font-size: 18px; margin-bottom: 12px; font-weight: 500; }
        .confirm-box p { color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        .confirm-btns { display: flex; gap: 14px; justify-content: center; }
        .confirm-btns button { padding: 12px 30px; border-radius: 12px; font-size: 14px; cursor: pointer; border: none; font-weight: 600; transition: all 0.3s; }
        .confirm-btns .btn-cancel { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.1); }
        .confirm-btns .btn-cancel:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .confirm-btns .btn-confirm { background: rgba(245,87,108,0.2); color: #f5576c; border: 1px solid rgba(245,87,108,0.3); }
        .confirm-btns .btn-confirm:hover { background: rgba(245,87,108,0.3); color: #fff; }
        .confirm-btns .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

        .empty { text-align: center; padding: 80px 20px; color: rgba(255,255,255,0.3); }
        .empty .icon { font-size: 60px; margin-bottom: 20px; opacity: 0.3; }

        .card-enter { opacity: 0; transform: translateY(30px); }
        .card-enter.visible { animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

        /* 用户下拉菜单 */
        .user-menu { position: relative; }
        .user-trigger { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 12px; cursor: pointer; transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .user-trigger:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); }
        .user-trigger .avatar { width: 34px; height: 34px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 600; }
        .user-trigger .name { font-size: 14px; color: rgba(255,255,255,0.8); }
        .user-trigger .arrow { font-size: 10px; color: rgba(255,255,255,0.4); transition: transform 0.3s; }
        .user-menu.open .arrow { transform: rotate(180deg); }
        .user-dropdown { position: absolute; top: calc(100% + 8px); right: 0; width: 200px; background: rgba(30,30,50,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 8px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .user-menu.open .user-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
        .user-dropdown a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 10px; font-size: 14px; transition: all 0.2s; }
        .user-dropdown a:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .user-dropdown a .icon { font-size: 16px; width: 20px; text-align: center; }
        .user-dropdown .divider { height: 1px; background: rgba(255,255,255,0.08); margin: 6px 12px; }
        .user-dropdown a.logout { color: #f5576c; }
        .user-dropdown a.logout:hover { background: rgba(245,87,108,0.1); color: #f5576c; }
    </style>
</head>
<body>
    <canvas class="bg-canvas" id="bgCanvas"></canvas>

    <nav class="navbar">
        <div class="brand"><div class="icon">&#129504;</div>心理健康测评系统</div>
        <div class="nav-links">
            <a th:href="@{/student/dashboard}">首页</a>
            <a th:href="@{/student/questionnaire/list}">测评中心</a>
            <a th:href="@{/student/assessment/history}" class="active">测评记录</a>
            <a th:href="@{/student/article/list}">知识园地</a>
            <a th:href="@{/student/mood/list}">心情日记</a>
            <a th:href="@{/student/appointment/list}">咨询预约</a>
        </div>
        <div class="user-menu" id="userMenu">
            <div class="user-trigger" onclick="toggleUserMenu()">
                <div class="avatar" th:text="${session.user?.realName != null ? #strings.substring(session.user.realName, 0, 1) : '同'}">张</div>
                <span class="name" th:text="${session.user?.realName ?: '同学'}">同学</span>
                <span class="arrow">&#9662;</span>
            </div>
            <div class="user-dropdown">
                <a th:href="@{/student/profile}"><span class="icon">&#9881;</span> 个人中心</a>
                <div class="divider"></div>
                <a th:href="@{/user/logout}" class="logout"><span class="icon">&#8592;</span> 退出登录</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div class="deco-line"></div>
            <h2>测 评 记 录</h2>
            <p>查看您的历史测评结果与分析报告</p>
        </div>

        <div th:if="${#lists.isEmpty(assessments)}" class="empty">
            <div class="icon">&#128203;</div>
            <p>暂无测评记录</p>
            <a th:href="@{/student/questionnaire/list}" style="display:inline-block;margin-top:20px;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:10px;text-decoration:none;font-size:14px;">去测评</a>
        </div>

        <div th:each="a, iter : ${assessments}" class="record-card card-enter" th:classappend="' level-' + ${a.level}" th:attr="data-delay=${iter.index * 100}">
            <div th:class="'score-circle ' + ${a.level}">
                <span class="num" th:text="${a.totalScore}">0</span>
                <span class="unit">分</span>
            </div>
            <div class="record-info">
                <h4 th:text="${a.questionnaireTitle}">问卷标题</h4>
                <div class="record-meta">
                    <span>&#128197; <span th:text="${#dates.format(a.createTime, 'yyyy-MM-dd HH:mm')}">时间</span></span>
                    <span th:if="${a.isWarning == 1}"><span class="warning-dot"></span> 已预警</span>
                </div>
            </div>
            <span th:class="'level-tag tag-' + ${a.level}"
                  th:text="${a.level == 'normal' ? '正常' : (a.level == 'light' ? '轻度' : (a.level == 'moderate' ? '中度' : '重度'))}">等级</span>
            <div class="record-actions">
                <a th:href="@{/student/assessment/result/{id}(id=${a.id})}" class="btn-detail">查看详情</a>
                <button class="btn-delete" th:attr="data-id=${a.id}, data-title=${a.questionnaireTitle}" onclick="confirmDelete(this)">删除</button>
            </div>
        </div>
    </div>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <h4>确认删除</h4>
            <p>确定要删除这条测评记录吗？此操作不可恢复。</p>
            <div class="confirm-btns">
                <button class="btn-cancel" onclick="closeConfirm()">取消</button>
                <button class="btn-confirm" id="confirmBtn" onclick="doDelete()">确认删除</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        var canvas=document.getElementById('bgCanvas'),ctx=canvas.getContext('2d'),W,H;
        function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
        resize();window.addEventListener('resize',resize);
        var dots=[];for(var i=0;i<30;i++)dots.push({x:Math.random()*2000,y:Math.random()*2000,r:Math.random()*1.5+0.5,vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.15,o:Math.random()*0.4+0.1});
        function drawBg(){ctx.clearRect(0,0,W,H);dots.forEach(function(d){d.x+=d.vx;d.y+=d.vy;if(d.x<0)d.x=W;if(d.x>W)d.x=0;if(d.y<0)d.y=H;if(d.y>H)d.y=0;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fillStyle='rgba(220,225,255,'+d.o+')';ctx.fill();});for(var i=0;i<dots.length;i++)for(var j=i+1;j<dots.length;j++){var dx=dots[i].x-dots[j].x,dy=dots[i].y-dots[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<100){ctx.beginPath();ctx.moveTo(dots[i].x,dots[i].y);ctx.lineTo(dots[j].x,dots[j].y);ctx.strokeStyle='rgba(150,170,255,'+(0.08*(1-dist/100))+')';ctx.lineWidth=0.4;ctx.stroke();}}requestAnimationFrame(drawBg);}
        drawBg();

        document.querySelectorAll('.card-enter').forEach(function(c){
            var delay=parseInt(c.getAttribute('data-delay'))||0;
            setTimeout(function(){c.classList.add('visible');},300+delay);
        });

        // 用户菜单
        window.toggleUserMenu=function(){document.getElementById('userMenu').classList.toggle('open');};
        document.addEventListener('click',function(e){if(!document.getElementById('userMenu').contains(e.target))document.getElementById('userMenu').classList.remove('open');});

        // 删除功能
        var currentDeleteId = null;
        window.confirmDelete = function(btn) {
            currentDeleteId = btn.getAttribute('data-id');
            document.getElementById('confirmOverlay').classList.add('show');
        };
        window.closeConfirm = function() {
            document.getElementById('confirmOverlay').classList.remove('show');
            currentDeleteId = null;
        };
        window.doDelete = function() {
            if (!currentDeleteId) return;
            var btn = document.getElementById('confirmBtn');
            btn.disabled = true;
            btn.textContent = '删除中...';
            fetch('/student/assessment/delete/' + currentDeleteId, {method:'POST', credentials:'same-origin'})
            .then(function(r){return r.json();})
            .then(function(d){
                if(d.error){alert(d.error);closeConfirm();return;}
                location.reload();
            })
            .catch(function(e){alert('删除失败：' + e.message);closeConfirm();});
        };
    })();
    </script>
</body>
</html>
