<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测评中 - 心理健康测评系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #0e0e1a; min-height: 100vh; overflow-x: hidden; color: #e0e0e0; }
        .bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        .navbar { background: rgba(20,20,35,0.85); backdrop-filter: blur(20px); padding: 0 30px; height: 64px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .navbar .brand { font-size: 17px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 10px; }
        .navbar .brand .icon { width: 34px; height: 34px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .navbar a { color: rgba(255,255,255,0.55); text-decoration: none; font-size: 14px; }

        .container { max-width: 750px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }

        /* 头部卡片 */
        .header-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 35px; margin-bottom: 30px; }
        .header-card h2 { font-size: 24px; color: #fff; margin-bottom: 8px; font-weight: 500; }
        .header-card p { color: rgba(255,255,255,0.4); font-size: 14px; line-height: 1.7; }
        .progress-wrap { margin-top: 24px; }
        .progress-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: rgba(255,255,255,0.4); }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2, #f093fb); background-size: 200% 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); animation: shimmer 3s ease infinite; }
        @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        /* 题目卡片 */
        .question-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 32px; margin-bottom: 20px; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; transform: translateY(30px); }
        .question-card.visible { opacity: 1; transform: translateY(0); }
        .question-card.answered { border-color: rgba(102,126,234,0.3); }
        .q-header { display: flex; align-items: center; margin-bottom: 20px; }
        .q-num { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: bold; margin-right: 16px; flex-shrink: 0; }
        .q-content { font-size: 17px; color: #fff; line-height: 1.6; }

        /* 选项 */
        .options { display: grid; gap: 10px; }
        .option-item { display: flex; align-items: center; padding: 16px 20px; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; cursor: pointer; transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; }
        .option-item::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at var(--ox, 50%) var(--oy, 50%), rgba(102,126,234,0.2) 0%, transparent 70%); opacity: 0; transition: opacity 0.4s; }
        .option-item:hover { border-color: rgba(102,126,234,0.3); background: rgba(255,255,255,0.04); transform: translateX(4px); }
        .option-item:hover::before { opacity: 1; }
        .option-item.selected { border-color: rgba(102,126,234,0.5); background: rgba(102,126,234,0.1); }
        .option-item.selected::before { opacity: 1; }
        .option-dot { width: 22px; height: 22px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; margin-right: 16px; flex-shrink: 0; position: relative; transition: all 0.3s; z-index: 1; }
        .option-item.selected .option-dot { border-color: #667eea; background: #667eea; box-shadow: 0 0 12px rgba(102,126,234,0.5); }
        .option-item.selected .option-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 8px; height: 8px; background: white; border-radius: 50%; }
        .option-text { font-size: 15px; color: rgba(255,255,255,0.7); z-index: 1; transition: color 0.3s; }
        .option-item.selected .option-text { color: #fff; font-weight: 600; }
        .score-badge { margin-left: auto; background: rgba(255,255,255,0.06); padding: 4px 12px; border-radius: 12px; font-size: 12px; color: rgba(255,255,255,0.3); z-index: 1; transition: all 0.3s; }
        .option-item.selected .score-badge { background: rgba(102,126,234,0.3); color: #c5cae9; }

        /* 提交区域 */
        .submit-area { text-align: center; margin-top: 40px; padding-bottom: 50px; }
        .btn-submit { padding: 16px 70px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 14px; font-size: 17px; cursor: pointer; font-weight: 600; letter-spacing: 2px; position: relative; overflow: hidden; transition: all 0.3s; }
        .btn-submit::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.6s; }
        .btn-submit:hover::before { left: 100%; }
        .btn-submit:hover { box-shadow: 0 8px 30px rgba(102,126,234,0.5); transform: translateY(-2px); }
        .btn-submit:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-submit:disabled::before { display: none; }
        .tip { text-align: center; color: rgba(255,255,255,0.3); font-size: 13px; margin-top: 14px; }
    </style>
</head>
<body>
    <canvas class="bg-canvas" id="bgCanvas"></canvas>

    <nav class="navbar">
        <div class="brand"><div class="icon">&#129504;</div>心理健康测评系统</div>
        <a th:href="@{/student/dashboard}">返回首页</a>
    </nav>

    <div class="container">
        <div class="header-card">
            <h2 th:text="${questionnaire.title}">问卷标题</h2>
            <p th:text="${questionnaire.description}">问卷说明</p>
            <div class="progress-wrap">
                <div class="progress-info">
                    <span>答题进度</span>
                    <span id="progressText">0 / <span id="totalDisplay">0</span> 题</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <form id="assessmentForm">
            <input type="hidden" name="questionnaireId" th:value="${questionnaire.id}">
            <div id="questionsContainer"
                 th:each="q : ${questionnaire.questions}"
                 th:attr="data-qid=${q.id}, data-content=${q.content}, data-options=${q.options}">
            </div>
            <div class="submit-area">
                <button type="submit" class="btn-submit" id="submitBtn" disabled>完成测评</button>
                <div class="tip" id="tipText">请完成所有题目后提交</div>
            </div>
        </form>
    </div>

    <script>
    (function() {
        // ========== 背景动效 ==========
        var canvas = document.getElementById('bgCanvas');
        var ctx = canvas.getContext('2d');
        var W, H;
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);

        var strokes = [];
        function Stroke() {
            this.points = [];
            var sx = Math.random()*W, sy = Math.random()*H;
            for(var i=0;i<6;i++) this.points.push({x:sx+(Math.random()-0.5)*400,y:sy+(Math.random()-0.5)*400});
            this.progress = Math.random(); this.speed = 0.0003+Math.random()*0.0004;
            this.maxOpacity = 0.08+Math.random()*0.07; this.opacity = 0; this.width = 0.8+Math.random()*0.8;
        }
        for(var i=0;i<6;i++) strokes.push(new Stroke());

        var rings = [];
        rings.push({x:W*0.1,y:H*0.3,r:100,a:0,s:0.002,o:0.08});
        rings.push({x:W*0.9,y:H*0.7,r:140,a:Math.PI,s:0.003,o:0.07});

        var dots = [];
        for(var i=0;i<30;i++) dots.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.5,vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.2,o:Math.random()*0.4+0.1});

        function drawBg() {
            ctx.clearRect(0,0,W,H);
            strokes.forEach(function(s) {
                s.progress += s.speed;
                if(s.progress>1){s.progress=0;var sx=Math.random()*W,sy=Math.random()*H;s.points=[];for(var i=0;i<6;i++)s.points.push({x:sx+(Math.random()-0.5)*400,y:sy+(Math.random()-0.5)*400});}
                var p=s.progress; var fade=p<0.2?p/0.2:(p>0.8?(1-p)/0.2:1); s.opacity=s.maxOpacity*fade;
                ctx.beginPath(); ctx.moveTo(s.points[0].x,s.points[0].y);
                for(var i=1;i<s.points.length-1;i++){var xc=(s.points[i].x+s.points[i+1].x)/2,yc=(s.points[i].y+s.points[i+1].y)/2;ctx.quadraticCurveTo(s.points[i].x,s.points[i].y,xc,yc);}
                ctx.strokeStyle='rgba(180,190,255,'+s.opacity+')'; ctx.lineWidth=s.width; ctx.stroke();
            });
            rings.forEach(function(r){
                r.a+=r.s; ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(r.a);
                ctx.beginPath(); ctx.arc(0,0,r.r,0,Math.PI*1.5); ctx.strokeStyle='rgba(180,160,255,'+r.o+')'; ctx.lineWidth=1.2; ctx.stroke();
                ctx.beginPath(); ctx.arc(0,0,r.r*0.6,Math.PI*0.5,Math.PI*2); ctx.strokeStyle='rgba(150,180,255,'+(r.o*0.8)+')'; ctx.lineWidth=0.8; ctx.stroke();
                ctx.restore();
            });
            dots.forEach(function(d){d.x+=d.vx;d.y+=d.vy;if(d.x<0)d.x=W;if(d.x>W)d.x=0;if(d.y<0)d.y=H;if(d.y>H)d.y=0;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fillStyle='rgba(220,225,255,'+d.o+')';ctx.fill();});
            for(var i=0;i<dots.length;i++)for(var j=i+1;j<dots.length;j++){var dx=dots[i].x-dots[j].x,dy=dots[i].y-dots[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<100){ctx.beginPath();ctx.moveTo(dots[i].x,dots[i].y);ctx.lineTo(dots[j].x,dots[j].y);ctx.strokeStyle='rgba(150,170,255,'+(0.08*(1-dist/100))+')';ctx.lineWidth=0.4;ctx.stroke();}}
            requestAnimationFrame(drawBg);
        }
        drawBg();

        // ========== 渲染题目 ==========
        var items = document.querySelectorAll('#questionsContainer[data-qid]');
        var questions = [];
        var container = document.getElementById('questionsContainer');
        for(var i=0;i<items.length;i++){var el=items[i];questions.push({id:parseInt(el.getAttribute('data-qid')),content:el.getAttribute('data-content'),options:el.getAttribute('data-options')});}
        container.innerHTML = '';
        var totalQuestions = questions.length;
        var answers = {};
        document.getElementById('totalDisplay').textContent = totalQuestions;

        function renderQuestions() {
            var html = '';
            for(var i=0;i<questions.length;i++){
                var q=questions[i],options;try{options=JSON.parse(q.options);}catch(e){options=[];}
                html+='<div class="question-card" id="qcard_'+q.id+'">';
                html+='<div class="q-header"><div class="q-num">'+(i+1)+'</div><div class="q-content">'+q.content+'</div></div>';
                html+='<div class="options">';
                for(var j=0;j<options.length;j++){
                    var opt=options[j],inputId='q'+q.id+'_s'+opt.score;
                    html+='<label class="option-item" for="'+inputId+'">';
                    html+='<input type="radio" name="q'+q.id+'" value="'+opt.score+'" id="'+inputId+'">';
                    html+='<div class="option-dot"></div>';
                    html+='<span class="option-text">'+opt.text+'</span>';
                    html+='<span class="score-badge">'+opt.score+'分</span>';
                    html+='</label>';
                }
                html+='</div></div>';
            }
            container.innerHTML = html;

            // 入场动画
            var cards = container.querySelectorAll('.question-card');
            cards.forEach(function(card,i){
                setTimeout(function(){card.classList.add('visible');},100+i*80);
            });

            // 选项事件
            container.querySelectorAll('input[type="radio"]').forEach(function(radio){
                radio.addEventListener('change',function(){
                    var qId=parseInt(this.name.replace('q',''));
                    answers[qId]=parseInt(this.value);
                    var card=document.getElementById('qcard_'+qId);
                    card.querySelectorAll('.option-item').forEach(function(item){item.classList.remove('selected');});
                    this.closest('.option-item').classList.add('selected');
                    card.classList.add('answered');
                    // 选中波纹
                    var ripple=document.createElement('div');
                    ripple.style.cssText='position:absolute;width:20px;height:20px;border-radius:50%;background:rgba(102,126,234,0.3);top:50%;left:50%;transform:translate(-50%,-50%) scale(0);animation:rippleAnim 0.6s ease-out forwards;pointer-events:none;z-index:10;';
                    this.closest('.option-item').appendChild(ripple);
                    setTimeout(function(){ripple.remove();},600);
                    updateProgress();
                });
            });

            // 选项鼠标跟随
            container.querySelectorAll('.option-item').forEach(function(opt){
                opt.addEventListener('mousemove',function(e){
                    var rect=this.getBoundingClientRect();
                    this.style.setProperty('--ox',((e.clientX-rect.left)/rect.width*100)+'%');
                    this.style.setProperty('--oy',((e.clientY-rect.top)/rect.height*100)+'%');
                });
            });
        }

        // 波纹动画CSS
        var style=document.createElement('style');
        style.textContent='@keyframes rippleAnim{0%{transform:translate(-50%,-50%) scale(0);opacity:1;}100%{transform:translate(-50%,-50%) scale(8);opacity:0;}}';
        document.head.appendChild(style);

        function updateProgress(){
            var answered=Object.keys(answers).length;
            var pct=answered/totalQuestions*100;
            document.getElementById('progressBar').style.width=pct+'%';
            document.getElementById('progressText').innerHTML=answered+' / '+totalQuestions+' 题';
            var btn=document.getElementById('submitBtn'),tip=document.getElementById('tipText');
            if(answered>=totalQuestions){btn.disabled=false;tip.textContent='所有题目已完成，点击提交';tip.style.color='#43e97b';}
            else{btn.disabled=true;tip.textContent='还剩 '+(totalQuestions-answered)+' 题未作答';tip.style.color='rgba(255,255,255,0.3)';}
        }

        document.getElementById('assessmentForm').addEventListener('submit',function(e){
            e.preventDefault();
            var answerArr=[];
            for(var i=0;i<questions.length;i++){var qId=questions[i].id;if(answers[qId]!==undefined)answerArr.push(answers[qId]);else{alert('请完成所有题目');return;}}
            var qid=document.querySelector('input[name="questionnaireId"]').value;
            var btn=document.getElementById('submitBtn');
            var tip=document.getElementById('tipText');
            btn.disabled=true;
            btn.textContent='提交中...';
            tip.textContent='正在提交，请稍候...';
            tip.style.color='rgba(255,255,255,0.5)';
            fetch('/student/assessment/submit',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'questionnaireId='+qid+'&answers='+JSON.stringify(answerArr),credentials:'same-origin'})
            .then(function(r){if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
            .then(function(d){
                if(d.error){alert(d.error);btn.disabled=false;btn.textContent='完成测评';tip.textContent='提交失败，请重试';tip.style.color='#f5576c';return;}
                if(!d.assessmentId){alert('提交失败：未获取到测评ID');btn.disabled=false;btn.textContent='完成测评';return;}
                window.location.href='/student/assessment/result/'+d.assessmentId;
            })
            .catch(function(err){alert('提交失败：'+err.message+'，请重试');btn.disabled=false;btn.textContent='完成测评';tip.textContent='提交出错，请检查网络后重试';tip.style.color='#f5576c';});
        });

        renderQuestions();
    })();
    </script>
</body>
</html>
