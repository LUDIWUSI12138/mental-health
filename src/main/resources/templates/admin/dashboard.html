<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据概览 - 管理后台</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .navbar { background: #1a1a2e; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .brand { color: white; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .navbar .brand .icon { width: 36px; height: 36px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .navbar a { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; }
        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: 240px; background: white; box-shadow: 2px 0 12px rgba(0,0,0,0.05); padding: 25px 0; }
        .sidebar a { display: flex; align-items: center; padding: 13px 28px; color: #666; text-decoration: none; font-size: 14px; transition: all 0.2s; gap: 10px; }
        .sidebar a:hover { background: #f5f5ff; color: #667eea; }
        .sidebar a.active { background: linear-gradient(90deg, #f0edff, transparent); color: #667eea; font-weight: 600; border-right: 3px solid #667eea; }
        .sidebar .section-title { padding: 10px 28px; font-size: 12px; color: #bbb; margin-top: 15px; }
        .main { flex: 1; padding: 30px; }
        .page-header { margin-bottom: 25px; }
        .page-header h2 { font-size: 24px; color: #333; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 16px; padding: 24px; position: relative; overflow: hidden; transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .stat-card .stat-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 14px; }
        .stat-card .stat-num { font-size: 32px; font-weight: bold; }
        .stat-card .stat-label { color: #999; font-size: 13px; margin-top: 4px; }
        .stat-card.purple .stat-icon { background: #f0edff; color: #667eea; }
        .stat-card.purple .stat-num { color: #667eea; }
        .stat-card.green .stat-icon { background: #e8f8f0; color: #27ae60; }
        .stat-card.green .stat-num { color: #27ae60; }
        .stat-card.orange .stat-icon { background: #fff3e0; color: #f39c12; }
        .stat-card.orange .stat-num { color: #f39c12; }
        .stat-card.red .stat-icon { background: #fde8e8; color: #e74c3c; }
        .stat-card.red .stat-num { color: #e74c3c; }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .chart-card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .chart-card h3 { font-size: 16px; color: #333; margin-bottom: 20px; }
        .chart-wrap { position: relative; height: 260px; }
        .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .panel { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .panel h3 { font-size: 16px; color: #333; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .panel h3 .dot { width: 8px; height: 8px; border-radius: 50%; }
        .panel h3 .dot.red { background: #e74c3c; }
        .panel h3 .dot.blue { background: #667eea; }
        .warn-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
        .warn-item:last-child { border-bottom: none; }
        .warn-item .warn-icon { width: 36px; height: 36px; border-radius: 10px; background: #fde8e8; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 14px; }
        .warn-item .warn-text { flex: 1; }
        .warn-item .warn-text .name { font-size: 14px; font-weight: 600; color: #333; }
        .warn-item .warn-text .desc { font-size: 12px; color: #999; margin-top: 2px; }
        .appt-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
        .appt-item:last-child { border-bottom: none; }
        .appt-item .appt-icon { width: 36px; height: 36px; border-radius: 10px; background: #fff3cd; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 14px; }
        .appt-item .appt-text { flex: 1; }
        .appt-item .appt-text .name { font-size: 14px; font-weight: 600; color: #333; }
        .appt-item .appt-text .desc { font-size: 12px; color: #999; margin-top: 2px; }
        .empty-tip { text-align: center; color: #ccc; padding: 30px; font-size: 14px; }
        .more-link { display: block; text-align: center; color: #667eea; font-size: 13px; margin-top: 10px; text-decoration: none; }
        .more-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand"><div class="icon">&#129504;</div>管理后台</div>
        <div><a th:href="@{/user/logout}">退出</a></div>
    </nav>
    <div class="layout">
        <div class="sidebar">
            <div class="section-title">数据总览</div>
            <a th:href="@{/admin/dashboard}" class="active">&#128200; 数据概览</a>
            <div class="section-title">用户管理</div>
            <a th:href="@{/admin/user/list}">&#128100; 学生管理</a>
            <div class="section-title">测评管理</div>
            <a th:href="@{/admin/questionnaire/list}">&#128221; 问卷管理</a>
            <a th:href="@{/admin/assessment/list}">&#128203; 测评记录</a>
            <div class="section-title">内容管理</div>
            <a th:href="@{/admin/article/list}">&#128214; 文章管理</a>
            <a th:href="@{/admin/announcement/list}">&#128227; 公告管理</a>
            <div class="section-title">服务中心</div>
            <a th:href="@{/admin/appointment/list}">&#128197; 预约管理</a>
            <a th:href="@{/admin/mood/list}">&#128151; 心情记录</a>
            <div class="section-title">预警中心</div>
            <a th:href="@{/admin/warning/list}">&#128680; 预警管理</a>
        </div>
        <div class="main">
            <div class="page-header"><h2>&#128200; 数据概览</h2></div>

            <div class="stats-row">
                <div class="stat-card purple">
                    <div class="stat-icon">&#128100;</div>
                    <div class="stat-num" th:text="${studentCount}">0</div>
                    <div class="stat-label">学生总数</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-icon">&#128221;</div>
                    <div class="stat-num" th:text="${assessmentCount}">0</div>
                    <div class="stat-label">测评记录</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-icon">&#128197;</div>
                    <div class="stat-num" th:text="${pendingAppointmentCount}">0</div>
                    <div class="stat-label">待处理预约</div>
                </div>
                <div class="stat-card red">
                    <div class="stat-icon">&#128680;</div>
                    <div class="stat-num" th:text="${warningCount}">0</div>
                    <div class="stat-label">预警总数</div>
                </div>
            </div>

            <div class="chart-row">
                <div class="chart-card">
                    <h3>测评等级分布</h3>
                    <div class="chart-wrap"><canvas id="levelChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>功能使用统计</h3>
                    <div class="chart-wrap"><canvas id="featureChart"></canvas></div>
                </div>
            </div>

            <div class="bottom-row">
                <div class="panel">
                    <h3><span class="dot red"></span>待处理预警</h3>
                    <div th:if="${#lists.isEmpty(recentWarnings)}" class="empty-tip">暂无待处理预警</div>
                    <div th:each="w : ${recentWarnings}" class="warn-item">
                        <div class="warn-icon">&#9888;</div>
                        <div class="warn-text">
                            <div class="name" th:text="${w.userName}">学生</div>
                            <div class="desc" th:text="${w.message}">预警信息</div>
                        </div>
                    </div>
                    <a th:href="@{/admin/warning/list}" class="more-link">查看全部 &#8594;</a>
                </div>
                <div class="panel">
                    <h3><span class="dot blue"></span>待确认预约</h3>
                    <div th:if="${#lists.isEmpty(pendingAppointments)}" class="empty-tip">暂无待确认预约</div>
                    <div th:each="a : ${pendingAppointments}" class="appt-item">
                        <div class="appt-icon">&#128197;</div>
                        <div class="appt-text">
                            <div class="name" th:text="${a.userName} + ' → ' + ${a.counselorName}">预约</div>
                            <div class="desc" th:text="${#dates.format(a.appointmentDate, 'MM-dd') + ' ' + ${a.appointmentTime}}">时间</div>
                        </div>
                    </div>
                    <a th:href="@{/admin/appointment/list}" class="more-link">查看全部 &#8594;</a>
                </div>
            </div>
        </div>
    </div>

    <script>
    var levelCtx = document.getElementById('levelChart').getContext('2d');
    new Chart(levelCtx, {
        type: 'doughnut',
        data: {
            labels: ['正常', '轻度', '中度', '重度'],
            datasets: [{
                data: [45, 25, 20, 10],
                backgroundColor: ['#43e97b', '#f6d365', '#f093fb', '#f5576c'],
                borderWidth: 0,
                hoverOffset: 8
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true } } },
            cutout: '60%'
        }
    });

    var featureCtx = document.getElementById('featureChart').getContext('2d');
    new Chart(featureCtx, {
        type: 'bar',
        data: {
            labels: ['心理测评', '心情日记', '知识文章', '咨询预约'],
            datasets: [{
                label: '使用次数',
                data: [128, 86, 256, 23],
                backgroundColor: ['#667eea', '#f093fb', '#43e97b', '#f6d365'],
                borderRadius: 8,
                borderSkipped: false,
                barThickness: 36
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: '#f0f0f0' }, ticks: { color: '#999' } },
                x: { grid: { display: false }, ticks: { color: '#666' } }
            }
        }
    });
    </script>
</body>
</html>
