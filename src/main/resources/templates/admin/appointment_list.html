<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约管理 - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .navbar { background: #1a1a2e; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .brand { color: white; font-size: 18px; font-weight: bold; }
        .navbar a { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; }
        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: 240px; background: white; box-shadow: 2px 0 12px rgba(0,0,0,0.05); padding: 25px 0; }
        .sidebar a { display: flex; align-items: center; padding: 13px 28px; color: #666; text-decoration: none; font-size: 14px; transition: all 0.2s; gap: 10px; }
        .sidebar a:hover { background: #f5f5ff; color: #667eea; }
        .sidebar a.active { background: linear-gradient(90deg, #f0edff, transparent); color: #667eea; font-weight: 600; border-right: 3px solid #667eea; }
        .sidebar .section-title { padding: 10px 28px; font-size: 12px; color: #bbb; margin-top: 15px; }
        .main { flex: 1; padding: 30px; }
        .page-header { margin-bottom: 25px; }
        .page-header h2 { font-size: 24px; color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        th { background: #f8f9fa; padding: 14px 16px; text-align: left; font-weight: 600; color: #555; font-size: 13px; }
        td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        tr:hover { background: #fafafa; }
        .appt-status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .appt-status.pending { background: #fff3cd; color: #856404; }
        .appt-status.approved { background: #d4edda; color: #155724; }
        .appt-status.rejected { background: #f8d7da; color: #721c24; }
        .appt-status.completed { background: #e8f0fe; color: #667eea; }
        .action-btn { padding: 5px 12px; border-radius: 6px; font-size: 12px; border: none; cursor: pointer; margin-right: 4px; }
        .btn-approve { background: #d4edda; color: #155724; }
        .btn-approve:hover { background: #27ae60; color: white; }
        .btn-reject { background: #f8d7da; color: #721c24; }
        .btn-reject:hover { background: #e74c3c; color: white; }
        .btn-complete { background: #e8f0fe; color: #667eea; }
        .btn-complete:hover { background: #667eea; color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <span class="brand">&#129504; 管理后台</span>
        <div><a th:href="@{/user/logout}">退出</a></div>
    </nav>
    <div class="layout">
        <div class="sidebar">
            <div class="section-title">数据总览</div>
            <a th:href="@{/admin/dashboard}">&#128200; 数据概览</a>
            <div class="section-title">用户管理</div>
            <a th:href="@{/admin/user/list}">&#128100; 学生管理</a>
            <div class="section-title">测评管理</div>
            <a th:href="@{/admin/questionnaire/list}">&#128221; 问卷管理</a>
            <a th:href="@{/admin/assessment/list}">&#128203; 测评记录</a>
            <div class="section-title">内容管理</div>
            <a th:href="@{/admin/article/list}">&#128214; 文章管理</a>
            <a th:href="@{/admin/announcement/list}">&#128227; 公告管理</a>
            <div class="section-title">服务中心</div>
            <a th:href="@{/admin/appointment/list}" class="active">&#128197; 预约管理</a>
            <a th:href="@{/admin/mood/list}">&#128151; 心情记录</a>
            <div class="section-title">预警中心</div>
            <a th:href="@{/admin/warning/list}">&#128680; 预警管理</a>
        </div>
        <div class="main">
            <div class="page-header"><h2>预约管理</h2></div>
            <table>
                <thead><tr><th>学生</th><th>咨询师</th><th>日期</th><th>时段</th><th>原因</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                    <tr th:each="a : ${appointments}">
                        <td><strong th:text="${a.userName}">学生</strong></td>
                        <td th:text="${a.counselorName}">咨询师</td>
                        <td th:text="${#dates.format(a.appointmentDate, 'yyyy-MM-dd')}">日期</td>
                        <td th:text="${a.appointmentTime}">时段</td>
                        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${a.reason}">原因</td>
                        <td>
                            <span th:class="'appt-status ' + ${a.status}"
                                  th:text="${a.status == 'pending' ? '待确认' : (a.status == 'approved' ? '已确认' : (a.status == 'rejected' ? '已拒绝' : '已完成'))}">状态</span>
                        </td>
                        <td>
                            <span th:if="${a.status == 'pending'}">
                                <button class="action-btn btn-approve" th:onclick="'handleAppt(' + ${a.id} + ', \'approved\')'">确认</button>
                                <button class="action-btn btn-reject" th:onclick="'handleAppt(' + ${a.id} + ', \'rejected\')'">拒绝</button>
                            </span>
                            <span th:if="${a.status == 'approved'}">
                                <button class="action-btn btn-complete" th:onclick="'handleAppt(' + ${a.id} + ', \'completed\')'">完成</button>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
    function handleAppt(id, status) {
        var reply = prompt('回复内容（选填）：');
        fetch('/admin/appointment/handle/' + id, {
            method: 'POST',
            headers: {'Content-Type':'application/x-www-form-urlencoded'},
            body: 'status=' + status + '&adminReply=' + encodeURIComponent(reply || '')
        }).then(function(r){return r.json();}).then(function(d){
            if (d.success) { location.reload(); } else { alert(d.error || '操作失败'); }
        });
    }
    </script>
</body>
</html>
