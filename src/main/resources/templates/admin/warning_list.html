<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预警管理 - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .navbar { background: #1a1a2e; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .brand { color: white; font-size: 18px; font-weight: bold; }
        .navbar a { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; }
        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: 240px; background: white; box-shadow: 2px 0 12px rgba(0,0,0,0.05); padding: 25px 0; }
        .sidebar a { display: flex; align-items: center; padding: 13px 28px; color: #666; text-decoration: none; font-size: 14px; transition: all 0.2s; gap: 10px; }
        .sidebar a:hover { background: #f5f5ff; color: #667eea; }
        .sidebar a.active { background: linear-gradient(90deg, #f0edff, transparent); color: #667eea; font-weight: 600; border-right: 3px solid #667eea; }
        .sidebar .section-title { padding: 10px 28px; font-size: 12px; color: #bbb; margin-top: 15px; }
        .main { flex: 1; padding: 30px; }
        .page-header { margin-bottom: 25px; }
        .page-header h2 { font-size: 24px; color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        th { background: #f8f9fa; padding: 14px 16px; text-align: left; font-weight: 600; color: #555; font-size: 13px; }
        td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        tr:hover { background: #fafafa; }
        .tag { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .tag-pending { background: #fff3cd; color: #856404; }
        .tag-resolved { background: #d4edda; color: #155724; }
        .tag-ignored { background: #e2e3e5; color: #383d41; }
        .tag-level { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .level-light { background: #fff3cd; color: #856404; }
        .level-moderate { background: #fde2cc; color: #8a4100; }
        .level-severe { background: #f8d7da; color: #721c24; }
        .action-btn { padding: 5px 12px; border-radius: 6px; font-size: 12px; text-decoration: none; margin-right: 6px; }
        .btn-resolve { background: #d4edda; color: #155724; }
        .btn-ignore { background: #f0f0f0; color: #888; }
        .empty { text-align: center; padding: 60px; background: white; border-radius: 14px; color: #999; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="navbar">
        <span class="brand">&#129504; 管理后台</span>
        <div><a th:href="@{/user/logout}">退出</a></div>
    </nav>
    <div class="layout">
        <div class="sidebar">
            <div class="section-title">数据总览</div>
            <a th:href="@{/admin/dashboard}">&#128200; 数据概览</a>
            <div class="section-title">用户管理</div>
            <a th:href="@{/admin/user/list}">&#128100; 学生管理</a>
            <div class="section-title">测评管理</div>
            <a th:href="@{/admin/questionnaire/list}">&#128221; 问卷管理</a>
            <a th:href="@{/admin/assessment/list}">&#128203; 测评记录</a>
            <div class="section-title">内容管理</div>
            <a th:href="@{/admin/article/list}">&#128214; 文章管理</a>
            <a th:href="@{/admin/announcement/list}">&#128227; 公告管理</a>
            <div class="section-title">服务中心</div>
            <a th:href="@{/admin/appointment/list}">&#128197; 预约管理</a>
            <a th:href="@{/admin/mood/list}">&#128151; 心情记录</a>
            <div class="section-title">预警中心</div>
            <a th:href="@{/admin/warning/list}" class="active">&#128680; 预警管理</a>
        </div>
        <div class="main">
            <div class="page-header"><h2>预警管理</h2></div>
            <div th:if="${#lists.isEmpty(warnings)}" class="empty">暂无预警记录</div>
            <table th:unless="${#lists.isEmpty(warnings)}">
                <thead>
                    <tr><th>学生</th><th>问卷</th><th>预警等级</th><th>分数</th><th>状态</th><th>时间</th><th>操作</th></tr>
                </thead>
                <tbody>
                    <tr th:each="w : ${warnings}">
                        <td><strong th:text="${w.userName}"></strong></td>
                        <td th:text="${w.questionnaireTitle}"></td>
                        <td>
                            <span th:if="${w.warningLevel == 'moderate'}" class="tag-level level-moderate">中度</span>
                            <span th:if="${w.warningLevel == 'severe'}" class="tag-level level-severe">重度</span>
                        </td>
                        <td><strong th:text="${w.score}"></strong> 分</td>
                        <td>
                            <span th:if="${w.status == 'pending'}" class="tag tag-pending">待处理</span>
                            <span th:if="${w.status == 'resolved'}" class="tag tag-resolved">已处理</span>
                            <span th:if="${w.status == 'ignored'}" class="tag tag-ignored">已忽略</span>
                        </td>
                        <td th:text="${#dates.format(w.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                        <td th:if="${w.status == 'pending'}">
                            <a th:href="@{/admin/warning/handle/{id}(id=${w.id}, status='resolved')}" class="action-btn btn-resolve">已处理</a>
                            <a th:href="@{/admin/warning/handle/{id}(id=${w.id}, status='ignored')}" class="action-btn btn-ignore">忽略</a>
                        </td>
                        <td th:unless="${w.status == 'pending'}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
